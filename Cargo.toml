[workspace]
resolver = "2"
members = [
    "cedfs-proto",
    "cedfs-kv",
]

[workspace.package]
version = "0.1.0"
authors = ["et3tsy"]
description = "A scalable distributed storage file system bridging cloud, edge, and device domains for cross-domain scenarios."
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

bincode = "1.3"

chrono = "0.4"
config = "0.15"

derive_builder = "0.20"
iota = "0.2"


async-trait = "0.1"
trait-variant = "0.1"

libc = "0.2"
clap = "4.5"


rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scc = "2.3"

futures = "0.3"
tokio = { version = "1.44", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3.19"

prost = "0.13"
tonic = "0.13"
tonic-build = "0.13"

