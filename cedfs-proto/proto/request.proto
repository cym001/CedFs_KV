syntax = "proto3";

package request;

service RequestServer {
    rpc Receive(ReceiveRequest) returns (ReceiveResponse);
}

// 1.接收推理请求
message ReceiveRequest {
    string model = 1; 
    string prompts = 2;
    int32 max_tokens = 3;
    string pre_request_id = 4; 
}

message ReceiveResponse {
    string request_id = 1; 
    string url = 2;
    int32 status = 3;
    string response = 4;
}