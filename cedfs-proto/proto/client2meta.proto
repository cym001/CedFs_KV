message GetAttrByPathRequest {
    string path = 1;
}

/// FIXME: Delete it
message GetAttrByPathResponse {
    bytes attr = 1;
}

/// FIXME: Delete it
message SetAttrByPathRequest {
    string path = 1;
    bytes set_attr = 2;
}

/// FIXME: Delete it
message SetAttrByPathResponse {
    bytes attr = 1;
}

message CopyReplicaRequest{
    uint64 first_block = 1;
    uint64 last_block = 2;
    BlocksPos blocks_pos = 3;
}

message CopyReplicaResponse{}

message GetAllNodeIpsRequest {
    optional string server_type = 1;  // Optional filter by server type (Meta, Data)
    optional string layer = 2;        // Optional filter by layer (Cloud, Edge, Device)
}

message NodeInfo {
    string ip = 1;                    // Node IP address
    uint32 port = 2;                  // Node port
    string server_type = 3;           // Server type (Meta, Data)
    string layer = 4;                 // Layer (Cloud, Edge, Device)
}

message GetAllNodeIpsResponse {
    repeated NodeInfo nodes = 1;      // List of nodes with type information
}

message GetUsageRequest {
    // No parameters needed - gets usage for the current physical host
}

message GetUsageResponse {
    uint64 total_space = 1;           // Total disk space in bytes
    uint64 used_space = 2;            // Used disk space in bytes
    uint64 available_space = 3;       // Available disk space in bytes
    double usage_percentage = 4;      // Usage percentage (0.0 to 100.0)
}
