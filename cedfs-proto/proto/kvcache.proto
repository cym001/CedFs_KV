syntax = "proto3";

package kvcache;

// 数据服务器信息
message DataServer {
    uint32 id = 1;         
    string ip = 2;                      // IP地址（字符串形式）
    uint32 http_port = 3;               // http端口
    uint32 init_port = 4;               // nixl init端口
    uint32 rpc_port = 5;                // rpc端口
    string model_name = 6;              // 模型名称
    string url = 7;                     // 实例url
}


// 分块的token信息
message Token_lists {
    repeated uint32 tokens = 1;    // token ids
}

// kvcache位置信息
message KvBlockPos {
    string model_name = 1;          // 模型名称
    string url  = 2;                // 推理实例的服务url
    uint32 len = 3;                 // 匹配的kvcache长度
}

message SearchResult{
    repeated KvBlockPos block_pos = 1;        // 单个请求的kv cache搜索结果
}

service KvMeta2Data {
    rpc UploadKvMeta(UploadKvMetaRequest) returns (UploadKvMetaResponse);
    rpc RegisterInstance(RegisterInstanceRequest) returns (RegisterInstanceResponse);
    rpc RemoveKvMeta(RemoveKvMetaRequest) returns (RemoveKvMetaResponse);
    rpc NewRequest(NewRequestRequest) returns (NewRequestResponse);
    rpc RequestEnd(RequestEndRequest) returns (RequestEndResponse);
}

// 1.数据服务器向元数据服务器上传本地新增kvcache元数据
message UploadKvMetaRequest {
    uint32 server_id = 1;
    repeated uint32 tokens = 2; 
}

message UploadKvMetaResponse {
    bool success = 1;
}

// 2.数据服务器向元数据服务器注册推理实例信息
message RegisterInstanceRequest {
    DataServer data_server = 1; 
}

message RegisterInstanceResponse {
    bool success = 1;
}

// 3.数据服务器向元数据服务器上传本地删除kvcache元数据
message RemoveKvMetaRequest {
    uint32 id = 1;    
    int32 remove_nums = 2;
    repeated bytes tokens_hash = 3;
}

message RemoveKvMetaResponse {
    bool success = 1;
}

// 4.数据服务器向元数据服务器上传本地新增请求
message NewRequestRequest {
    uint32 server_id = 1;
    string request_id = 2;
    repeated uint32 tokens = 3; 
}

message NewRequestResponse {
    bool success = 1;
}

// 5.数据服务器向元数据服务器上传本地请求结束
message RequestEndRequest {
    uint32 server_id = 1;
    string request_id = 2;
    repeated uint32 tokens = 3;  
}

message RequestEndResponse {
    bool success = 1;
}

service KvMeta2Meta {
    rpc SearchKvBlock(SearchKvBlockRequest) returns (SearchKvBlockResponse);
    rpc SearchKvBlockByPrompts(SearchKvBlockByPromptsRequest) returns (SearchKvBlockByPromptsResponse);
}


// 3. SearchKvBlock - 根据token查找kvblock
message SearchKvBlockRequest {
    repeated Token_lists query_lists = 1;
}

message SearchKvBlockResponse {
    repeated SearchResult results = 1;
}

// 4. SearchKvBlockByPrompts - 根据prompts查找kvblock
message SearchKvBlockByPromptsRequest {
    repeated string model_name = 1;
    repeated string prompts = 2;
}

message SearchKvBlockByPromptsResponse {
    repeated SearchResult results = 1;
}